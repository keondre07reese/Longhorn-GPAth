<title>Longhorn GPAth</title>
<header class="hero">
  <h1>Longhorn GPAth</h1>
  <p class="hero-subtitle">Your UT GPA planning tool</p>
  <img src="c:\Users\keond\Downloads\hook em.png" alt="Longhorn GPAth logo" class="hero-logo" />
</header>
<main class="app-content">
  <!-- your cards and calculator stuff -->
</main>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<body>
  <div class="container">
    <div class="card">
      <h2>Current Academic Standing</h2>
      
      <label for="currentGPA">Current Cumulative GPA</label>
      <input type="number" id="currentGPA" step="0.01" placeholder="ex: 3.57" />

      <label for="completedCredits">Completed Credit Hours</label>
      <input type="number" id="completedCredits" step="1" placeholder="ex: 7" />
    </div>

    <div class="card">
      <h2>Semester Courses</h2>
      <div id="coursesContainer"></div>
      <button id="addCourseBtn" type="button">Add Course</button>
    </div>

    <div class="card">
      <button id="calculateBtn" type="button">Calculate GPA</button>
      <button id="resetBtn" type="button">Reset</button>
      <p id="errorMessage" class="error"></p>

      <div id="results" class="results">
        <h2>Results</h2>
        <p><strong>Projected Semester GPA:</strong> <span id="semesterGPAResult">--</span></p>
        <p><strong>Projected Cumulative GPA:</strong> <span id="cumulativeGPAResult">--</span></p>
        <p><strong>Total Semester Credit Hours:</strong> <span id="semesterCreditsResult">--</span></p>
        <label for="targetGPA">Target GPA (optional)</label>
<input type="number" id="targetGPA" step="0.01" placeholder="e.g. 3.80" />
        <p id="summaryText"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
